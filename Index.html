<html>


<head>
    <title>Cristiano Ronaldo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #363434;
        }

      

        .Navbar {
            background: linear-gradient(135deg, #111111, #292929);
            text-align: center;
            padding: 25px 15px;
            border-bottom: 3px solid #e63946;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .Navbar h1 {
            color: white;
            font-size: 45px;
            margin: 5px 0 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
        }

        .Navbar a {
            text-decoration: none;
        }

        .Navbar button {
            background: linear-gradient(135deg, #e63946, #b71c1c);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    
        .Hero {
            max-width: 1100px;
            min-height: 600px;
            margin: 50px auto;
            padding: 50px 40px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: linear-gradient(
                145deg,
                #414141,
                #2c2c2c
            );

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .Hero img {
            width: 350px;
            height: 250px;
            max-width: 90%;

            object-fit: cover;

            border-radius: 15px;

            border: 4px solid #e63946;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(230, 57, 70, 0.3);

            transition: 0.4s ease;
        }

        .Hero h2 {
            color: #e63946;
            font-size: 40px;
            margin-top: 35px;
            margin-bottom: 15px;

            font-weight: bold;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, 0.6);
        }

        .Hero p {
            max-width: 800px;

            color: #ffffff;
            font-size: 20px;
            line-height: 1.7;

            margin: 0 auto;

            text-align: center;
        }

    </style>
</head>
<body>
    <div class="Navbar">
        <h1>Cristiano Ronaldo</h1>
        <a href="Index.html">
            <button>Home</button>
        </a>
        <a href="Biodata.html">
            <button>Biodata</button>
        </a>
        <a href="Career and achievment.html">
            <button>Career & Achievements</button>
        </a>
        <a href="MiniGame.html">
            <button>Mini Game</button>
        </a>
    </div>
    <div class="Hero">
        <img
            src="Ronaldo Style.jpeg"
            alt="Cristiano Ronaldo"
        >
        <h2>
            The Legend of Football
        </h2>
        <p>
            Cristiano Ronaldo is a famous Portuguese football player born on
            February 5, 1985. He is widely known as one of the greatest players
            in the history of football, winning five Ballon d'Or awards and
            scoring over 900 career goals.

        </p>
    </div>
</body>
</html>
